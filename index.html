<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f1eb" />
  <title>ナオコバースデー杯</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <div>
        <h1>🏐 ナオコバースデー杯</h1>
        <p>7点先取。ボールが近づいたらタップ！</p>
      </div>
    </header>

    <p id="status" class="status" aria-live="polite">
      ボールが自分の近くに来たらタップ。7点先取です。
    </p>

    <section class="game-shell" aria-label="ナオコバースデー杯 バレーボールゲーム">
      <canvas id="game" width="1280" height="720">
        このブラウザはCanvasに対応していません。
      </canvas>

      <div class="bottom-controls">
        <button id="hitBtn" class="hit" type="button">🏐 タップ！</button>
        <div class="sub-controls">
          <button id="pauseBtn" type="button">タイム</button>
          <button id="restartBtn" type="button">最初から</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
